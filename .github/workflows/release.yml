name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  GHCR_IMAGE: ghcr.io/gabeduartem/blocky-ui
  DOCKERHUB_IMAGE: gabrielduartem/blocky-ui

jobs:
  release:
    name: Changesets
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.published-packages }}
    permissions:
      checks: write
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun run release:version
          publish-script: bun changeset publish
          commit-message: "chore: update versions"
          pr-title: "Release new version"

      - name: Skip CI for release-only changes
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          set -euo pipefail

          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefOid,headRefOid)
          BASE_SHA=$(jq -r .baseRefOid <<< "$pr")
          HEAD_SHA=$(jq -r .headRefOid <<< "$pr")
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          before=$(git show "$base:package.json" | jq -eS 'select(.version | type == "string") | del(.version)')
          after=$(git show "$HEAD_SHA:package.json" | jq -eS 'select(.version | type == "string") | del(.version)')

          if [[ "$before" = "$after" ]] &&
            git diff --quiet "$base" "$HEAD_SHA" -- . \
              ':(exclude)CHANGELOG.md' ':(exclude)package.json' \
              ':(exclude,glob).changeset/*.md' &&
            git diff --quiet --no-renames --diff-filter=d "$base" "$HEAD_SHA" -- .changeset &&
            git diff --quiet "$base" "$HEAD_SHA" -- .changeset/README.md; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name=CI \
              -f head_sha="$HEAD_SHA" \
              -f status=completed \
              -f conclusion=skipped \
              -f 'output[title]=Release metadata only' \
              -f 'output[summary]=CI is not required for the Changesets version bump and release notes.'
          fi

      - name: Format GitHub release notes
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: bun run release:format

  publish-docker:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        package: ${{ fromJson(needs.release.outputs.publishedPackages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker Image Publish
        uses: ./.github/actions/publish-docker-image
        with:
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          cache-ref: ${{ env.GHCR_IMAGE }}:buildcache
          cache-policy: read-only
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ matrix.package.version }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ matrix.package.version }}

  cleanup-failed-release:
    name: Cleanup Failed Release
    runs-on: ubuntu-latest
    needs:
      - release
      - publish-docker
    if: ${{ always() && needs.release.outputs.published == 'true' && needs.publish-docker.result == 'failure' }}
    permissions:
      contents: write

    steps:
      - name: Delete GitHub releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ needs.release.outputs.publishedPackages }}
        run: |
          set -euo pipefail

          failed_tags=()

          for version in $(printf '%s' "$PUBLISHED_PACKAGES" | jq -r '.[].version'); do
            tag="v${version}"
            if ! release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq "map(select(.tag_name == \"${tag}\"))[0].id // empty"); then
              echo "Failed to look up release for $tag"
              failed_tags+=("$tag")
              release_id=""
            fi

            if [ -n "$release_id" ]; then
              echo "Deleting release for $tag"
              if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"; then
                echo "Failed to delete release for $tag"
                failed_tags+=("$tag")
              fi
            fi

            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Deleting tag for $tag"
              if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"; then
                echo "Failed to delete tag for $tag"
                failed_tags+=("$tag")
              fi
            fi
          done

          if [ "${#failed_tags[@]}" -gt 0 ]; then
            printf 'Failed to clean up tags: %s\n' "${failed_tags[*]}"
            exit 1
          fi
